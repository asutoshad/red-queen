<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the daemon's name, so no other program can
       impersonate it. -->
  <policy user="root">
    <allow own="io.github.asutoshad.RedQueen.Daemon"/>
  </policy>

  <!-- Anyone may call it. What each method may do is decided by the daemon
       itself (input validation and polkit), not by the bus. -->
  <policy context="default">
    <allow send_destination="io.github.asutoshad.RedQueen.Daemon"/>
  </policy>
</busconfig>
