[workspace]
resolver = "3"
members = ["crates/rq-core", "crates/rq-hardware", "crates/rq-testkit", "crates/redqueen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/asutoshad/red-queen"
publish = false

[workspace.dependencies]
rq-core = { path = "crates/rq-core" }
rq-hardware = { path = "crates/rq-hardware" }
rq-testkit = { path = "crates/rq-testkit" }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
