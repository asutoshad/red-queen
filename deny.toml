# Dependency policy, checked with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Fail on any known vulnerability or unmaintained/yanked crate.
ignore = []

[licenses]
# Every dependency must be compatible with GPL-3.0-or-later.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "GPL-3.0-or-later",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
# The list covers dependencies added in later releases too.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
